<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/d5db7a7f2b.js" crossorigin="anonymous"></script>
</head>

<body class="bg-dark text-light">
    <header class="shadow-sm">
        <nav class="navbar navbar-expand-lg navbar-dark bg-black bg-opacity-75 py-2 px-4">
            <a class="navbar-brand mx-5" href="index.html">
                <h3>My Portfolio</h3>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse py-3" id="navMenu">
                <ul class="navbar-nav ms-auto gap-3">
                    <li>
                        <a href="index.html" class="nav-link mx-2">Home</a>
                    </li>
                    <li>
                        <a href="contact.html" class="nav-link active mx-2 me-5">Contacts</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="container p-4">
        <h1 class="fw-bold text-center mb-4">If You Want to Reach Me</h1>
        <div class="mx-auto p-4 rounded-4 shadow-lg bg-black bg-opacity-50" style="max-width: 600px;">
            <form>
                <div class="mb-3">
                    <label class="form-label fw-bold">Name</label>
                    <input type="text" class="form-control" placeholder="Full Name">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control" placeholder="abc@gmail.com">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Message</label>
                    <textarea class="form-control" rows="4" placeholder="Comment section..."></textarea>
                </div>

                <button type="submit" class="btn btn-outline-danger w-100">Submit</button>
            </form>
        </div>

        <div class="text-center mt-2 fs-5">
            <i class="fa fa-envelope"></i> Email: <a href="mailto:arsema12mengistu@gmail.com" class="text-light">arsema12mengistu@gmail.com</a><br>
            <p><i class="fas fa-map-marker-alt"></i> Addis Ababa, Ethiopia</p>
        </div>
    </div>

    <footer class="bg-danger bg-opacity-25 text-center py-3 mt-2">
        <p class="m-0">All rights reserved. © 2025 Arsema Mengistu</p>
    </footer>
</body>

</html>
